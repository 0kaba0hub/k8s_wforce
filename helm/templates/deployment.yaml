apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ tpl (.Files.Get "files/wforce.conf") . | sha256sum }}
    spec:
      containers:
        - name: wforce
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [wfwrapper]
          env:
            - name: WFORCE_CONFIG_FILE
              value: /etc/wforce/wforce.conf
            - name: WFORCE_HTTP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret.name }}, key: {{ .Values.existingSecret.passwordKey }}}}
            - name: WFORCE_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret.name }}, key: {{ .Values.existingSecret.keyKey }}}}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: conf, mountPath: /etc/wforce/wforce.conf, subPath: wforce.conf, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: {{ .Release.Name }}}
