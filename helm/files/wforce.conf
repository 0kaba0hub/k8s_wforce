addListener("0.0.0.0:{{ .Values.port }}", false, "", "", {})
setWebserverPassword(os.getenv("WFORCE_HTTP_PASSWORD"))
setKey(os.getenv("WFORCE_KEY"))
controlSocket("127.0.0.1:4004")
{{- range .Values.acl }}
addACL({{ . | quote }})
{{- end }}

local field_map = {}
field_map["diffFailedPasswords"] = "hll"
newStringStatsDB("OneHourDB", 600, 6, field_map)

local function fields(lt)
   local f = {
      login = lt.login, remote = lt.remote:tostring(), pwhash = lt.pwhash,
      protocol = lt.protocol, tls = tostring(lt.tls), device_id = lt.device_id,
      session_id = lt.session_id, success = tostring(lt.success),
      policy_reject = tostring(lt.policy_reject),
   }
   for k, v in pairs(lt.attrs) do f["attr_" .. k] = tostring(v) end
   return f
end

function report(lt)
{{- if .Values.policy.logRequests }}
   infoLog("report", fields(lt))
{{- end }}
   if not lt.success and not lt.policy_reject then
      local sdb = getStringStatsDB("OneHourDB")
      sdb:twAdd(lt.remote, "diffFailedPasswords", lt.pwhash)
      sdb:twAdd(lt.remote:tostring() .. ":" .. lt.login, "diffFailedPasswords", lt.pwhash)
   end
end
setReport(report)

function allow(lt)
{{- if .Values.policy.logRequests }}
   infoLog("allow", fields(lt))
{{- end }}
   local sdb = getStringStatsDB("OneHourDB")
   if sdb:twGet(lt.remote, "diffFailedPasswords") > {{ .Values.policy.refuseAfter }} then
      return -1, {{ .Values.policy.refuseMessage | quote }}, "too many different failed passwords by IP", { attempts = {{ .Values.policy.refuseAfter }} }
   end
   if sdb:twGet(lt.remote:tostring() .. ":" .. lt.login, "diffFailedPasswords") > {{ .Values.policy.tarpitAfter }} then
      return {{ .Values.policy.tarpitSecs }}, "", "too many different failed passwords by IP/login", { attempts = {{ .Values.policy.tarpitAfter }} }
   end
   return 0, "", "", {}
end
setAllow(allow)

function reset(type, login, ip)
   local sdb = getStringStatsDB("OneHourDB")
   if string.find(type, "ip") then sdb:twReset(ip) end
   if string.find(type, "login") then sdb:twReset(login) end
   if string.find(type, "ip") and string.find(type, "login") then
      sdb:twReset(ip:tostring() .. ":" .. login)
   end
   return true
end
setReset(reset)
